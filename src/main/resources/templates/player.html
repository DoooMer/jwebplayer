<!doctype html>
<html lang="ru" xmlns:th="https://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Веб аудиоплеер</title>
        <th:block th:replace="fragments/materialize::font"></th:block>
        <th:block th:replace="fragments/materialize::css"></th:block>
        <th:block th:replace="fragments/player::css"></th:block>
    </head>

    <body>
        <div class="player-container">
            <!-- Управление воспроизведением -->
            <div class="sticky-header">
                <div class="player-controls">
                    <div class="track-title empty" id="trackTitle">
                        Выберите трек
                    </div>
                    <div class="controls-row">
                        <button
                            class="btn-control"
                            id="btnPrev"
                            title="Предыдущий трек"
                        >
                            <i class="material-icons">skip_previous</i>
                        </button>
                        <button
                            class="btn-control play-pause"
                            id="btnPlay"
                            title="Воспроизвести"
                        >
                            <i class="material-icons">play_arrow</i>
                        </button>
                        <button
                            class="btn-control"
                            id="btnNext"
                            title="Следующий трек"
                        >
                            <i class="material-icons">skip_next</i>
                        </button>
                    </div>
                    <div class="progress track-timeline">
                        <div
                            class="determinate"
                            style="width: 0"
                            id="timeline"
                        ></div>
                    </div>
                </div>

                <!-- Выбор плейлиста -->
                <div class="playlist-section">
                    <div class="playlist-row">
                        <div class="input-field">
                            <select id="playlistSelect">
                                <option selected>-</option>
                            </select>
                            <label>Плейлист</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Список треков -->
            <div class="tracks-list">
                <div class="search-row">
                    <i class="material-icons">search</i>
                    <input type="text" id="trackSearch" placeholder="Поиск по названию трека">
                </div>
                <ul class="collection" id="tracksList">
                    <li class="collection-item">
                        <span class="track-number">—</span>
                        <div class="track-main">
                            <span class="track-name">Выберите плейлист</span>
                        </div>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Плавающая кнопка настроек -->
        <button
            class="fab-settings btn-floating btn-large waves-effect waves-light"
            id="btnSettings"
            title="Настройки"
        >
            <i class="material-icons">settings</i>
        </button>
        <button
            class="fab-volume btn-floating btn-large waves-effect waves-light"
            id="btnVol"
            title="Громкость"
        >
            <i class="material-icons">volume_up</i>
        </button>

        <!-- Модальное окно настроек -->
        <div id="modalSettings" class="modal">
            <div class="modal-content">
                <h4>Настройки</h4>

                <div class="settings-section">
                    <h5>Плейлисты</h5>
                    <ul
                        id="settingsPlaylistsList"
                        class="collection settings-playlists-list"
                    ></ul>
                    <div class="input-field">
                        <input type="text" id="settingsNewPlaylistName" />
                        <label for="settingsNewPlaylistName"
                            >Новый плейлист</label
                        >
                    </div>
                    <button
                        class="btn waves-effect waves-light"
                        id="settingsAddPlaylistBtn"
                    >
                        <i class="material-icons left">add</i>Добавить плейлист
                    </button>
                </div>

                <div class="settings-section">
                    <h5>Показать плейлист</h5>
                    <div class="switch">
                        <label>
                            Скрыть
                            <input
                                type="checkbox"
                                id="toggleMainView"
                                checked
                            />
                            <span class="lever"></span>
                            Показать
                        </label>
                    </div>
                </div>

                <div class="settings-section">
                    <h5>Автоматический переход на следующий трек</h5>
                    <div class="switch">
                        <label>
                            Нет
                            <input type="checkbox" id="autoPlayNext" checked />
                            <span class="lever"></span>
                            Да
                        </label>
                    </div>
                </div>

                <div class="settings-section">
                    <h5>Повтор текущего трека</h5>
                    <div class="switch">
                        <label>
                            Нет
                            <input type="checkbox" id="repeatTrack" />
                            <span class="lever"></span>
                            Да
                        </label>
                    </div>
                </div>

                <div class="settings-section">
                    <h5>Шаг изменения громкости</h5>
                    <div class="input-field">
                        <input
                            type="number"
                            id="volumeStep"
                            min="0.001"
                            max="5"
                            step="0.01"
                        />
                        <!--                        <label for="volumeStep">Шаг громкости</label>-->
                        <!--                <span class="helper-text">На сколько изменяется громкость</span>-->
                    </div>
                </div>
            </div>
        </div>

        <!-- Модальное окно добавления трека в плейлист -->
        <div id="modalAddToPlaylist" class="modal">
            <div class="modal-content">
                <h4>Добавить в плейлист</h4>
                <p class="modal-subtitle">
                    Выберите плейлист, в который добавить трек.
                </p>
                <ul
                    id="addToPlaylistsList"
                    class="collection add-playlists-list"
                ></ul>
            </div>
            <div class="modal-footer">
                <button
                    class="btn-flat waves-effect"
                    id="addToPlaylistCancelBtn"
                >
                    Отмена
                </button>
            </div>
        </div>

        <script th:replace="fragments/materialize::js"></script>
        <script th:replace="fragments/player::js"></script>
    </body>
</html>
